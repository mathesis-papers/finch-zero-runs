[site]
repo = "mathesis-papers/finch-zero-runs"
base_url = "https://papers.trureturing.org/finch-zero-runs/"
post_build = ["python3", "-c", "from pathlib import Path\nimport runpy\nscript = Path(\"docs/layer-mathesis/scripts/site.py\")\nif script.is_file():\n    runpy.run_path(str(script), run_name=\"__main__\")\nelse:\n    print(\"Mathesis post-build skipped: layer script is absent from repository being built\")\n"]
languages = ["zh", "en"]
[site.title]
zh = "Extending Finch's zero-run analysis: nonattainment and a corrected capture theorem"
en = "Extending Finch's zero-run analysis: nonattainment and a corrected capture theorem"
[trureturing]
repo = "the-omega-institute/trureturing"
branch = "dev"
[books]
order = ["finch-zero-runs"]
hide = []
